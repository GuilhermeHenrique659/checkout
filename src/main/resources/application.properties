spring.application.name=${APP_NAME:checkout-event-driven}
server.port=${APP_PORT:8080}
# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:checkout}
spring.datasource.username=${POSTGRES_USER:checkout}
spring.datasource.password=${POSTGRES_PASSWORD:checkout}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# Messaging
app.publisher.provider=outbox
app.eventBus.provider=outbox
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:5000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:10}
